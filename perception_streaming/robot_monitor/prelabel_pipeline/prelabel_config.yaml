cvat_servers:
  - id: "remote"
    name: "远程服务器"
    host: "192.168.55.246"
    port: 8080
    user: "${CVAT_REMOTE_USER}"
    password: "${CVAT_REMOTE_PASSWORD}"
  - id: "local"
    name: "本机服务器"
    host: "localhost"
    port: 8080
    user: "${CVAT_LOCAL_USER}"
    password: "${CVAT_LOCAL_PASSWORD}"

docker:
  container: "MPformer"

model:
  demo_dir: "${MPFORMER_ROOT}/MP-Former/demo"
  config: "${MPFORMER_ROOT}/MP-Former/output/config.yaml"
  weights: "${MPFORMER_ROOT}/MP-Former/output/model_1884999.pth"
  min_area: 50
  smooth_contours: true
  fill_holes: true

labels_csv: "${MPFORMER_ROOT}/MP-Former/demo/lhx/labels.csv"
output_base: "${MPFORMER_ROOT}/MP-Former/demo/output"
upload_dir: "${STREAMING_DIR}/data/prelabel_uploads"
runs_dir: "${STREAMING_DIR}/data/prelabel_runs"
browse_roots:
  - "${MPFORMER_ROOT}"
segment_size: 1000

# Immutable contract for the Alpha50 A/B candidate.  A run persists a manifest
# from this snapshot; later orchestration must never re-read this mutable file.
alpha50_candidate:
  framework_root: "/media/sdc2/lhx/MPformer/MP-Former"
  framework_revision: "git-head:a71f504a467d7079cf02726a05ff23bbb933607d"
  output_path: "${STREAMING_DIR}/data/prelabel_runs/alpha50_candidate"
  framework_imports: ["torch", "detectron2"]
  weights:
    - path: "/media/sdc2/lhx/MPformer/MP-Former/output/model_1884999.pth"
      sha256: "a6595535ec772aaa011abd738a377ca063815b8320d2acf4acdc91ef54221222"
  tta:
    scales: [768, 832]
    flip: true
    interpolation: "bilinear"
  fusion:
    method: "mean_logits"
    align_corners: false
  export:
    ignore_policy: "drop"
    background_policy: "exclude"
    confidence_policy: "per-class-softmax-threshold"
    confidence_threshold: 0.50
    input_normalization:
      color_order: "RGB"
      pixel_range: "0_1"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    contours:
      min_area: 50
      approx_epsilon: 1.5
      smooth: true
      fill_holes: true
  min_vram_gb: 8
  min_disk_gb: 20
  label_mapping:
    "0": {canonical: "background", cvat: "background"}
    "1": {canonical: "lawn", cvat: "lawn草地"}
    "2": {canonical: "sky", cvat: "sky天空"}
    "3": {canonical: "building_wall", cvat: "building,wall建筑，墙体"}
    "4": {canonical: "fence", cvat: "fence栅栏"}
    "5": {canonical: "back_tree", cvat: "back_tree背景树"}
    "6": {canonical: "pole", cvat: "pole杆子"}
    "7": {canonical: "obstacle_tree", cvat: "obstacle_tree固定障碍树"}
    "8": {canonical: "curb_step", cvat: "curb,step马路牙子，台阶"}
    "9": {canonical: "fixed_obstacle", cvat: "fixed obstacle固定障碍物"}
    "10": {canonical: "grass_bush", cvat: "grass_bush类似于草的灌木"}
    "11": {canonical: "limb_bush", cvat: "limb_bush有枝干结构的灌木"}
    "12": {canonical: "car", cvat: "car车辆，自行车，电瓶车，摩托车"}
  expected_cvat_schema:
    version: 1
    labels:
      - {name: "background", type: "polygon", attributes: []}
      - {name: "lawn草地", type: "polygon", attributes: []}
      - {name: "sky天空", type: "polygon", attributes: []}
      - {name: "building,wall建筑，墙体", type: "polygon", attributes: []}
      - {name: "fence栅栏", type: "polygon", attributes: []}
      - {name: "back_tree背景树", type: "polygon", attributes: []}
      - {name: "pole杆子", type: "polygon", attributes: []}
      - {name: "obstacle_tree固定障碍树", type: "polygon", attributes: []}
      - {name: "curb,step马路牙子，台阶", type: "polygon", attributes: []}
      - {name: "fixed obstacle固定障碍物", type: "polygon", attributes: []}
      - {name: "grass_bush类似于草的灌木", type: "polygon", attributes: []}
      - {name: "limb_bush有枝干结构的灌木", type: "polygon", attributes: []}
      - {name: "car车辆，自行车，电瓶车，摩托车", type: "polygon", attributes: []}
